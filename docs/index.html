function selectPortfolio(id){const next=book.portfolios.find(x=>x.id===id);if(!next)return;book.activePortfolioId=id;state=next;selected=null;listFilter='all';reorderMode=false;filtersOpen=false;save();render();window.marketQuotes?.onPortfolioLoaded?.(KEY.slice('financial-center-firebase-'.length))}

function portfolioDialog(edit=false){const current=currentPortfolio();$('#modal').innerHTML=`<div class="dialog"><div role="dialog" aria-modal="true" aria-label="${edit?'עריכת תיק':'תיק חדש'}"><h2>${edit?'עריכת תיק':'תיק חדש'}</h2><form id="portfolioForm"><label>שם התיק / הברוקר</label><input name="name" maxlength="40" required value="${edit?esc(current.name):''}" placeholder="למשל: הבנק או הברוקר שלי"><div class="actions"><button type="button" class="btn" id="cancelPortfolio">ביטול</button>${edit&&book.portfolios.length>1?'<button type="button" class="btn danger" id="deletePortfolio">מחק תיק</button>':''}<button class="btn primary">שמירה</button></div></form></div>`;$('#cancelPortfolio').onclick=close;$('#deletePortfolio')?.addEventListener('click',()=>{if(!confirm(`למחוק את התיק ${current.name} וכל המניות וההתראות שלו?`))return;book.portfolios=book.portfolios.filter(x=>x.id!==current.id);book.activePortfolioId=book.portfolios[0].id;state=currentPortfolio();selected=null;save();close();render()});$('#portfolioForm').onsubmit=e=>{e.preventDefault();const name=String(new FormData(e.target).get('name')).trim();if(!name)return;if(edit)current.name=name;else{const next=makePortfolio(name);book.portfolios.push(next);book.activePortfolioId=next.id;state=next;selected=null}save();close();render()}}
function miniChart(x){const recent=validIntraday(x);if(recent.length<2)return '';const vals=recent.map(p=>p.value),baseline=Number(x.prevClose)||vals[0],lo=Math.min(...vals,baseline),hi=Math.max(...vals,baseline),span=hi-lo||1,y=v=>26-(v-lo)/span*20,points=vals.map((v,i)=>`${i*95/(vals.length-1)},${y(v)}`).join(' ');return `<svg class="mini-chart" viewBox="0 0 100 32" preserveAspectRatio="none" role="img" aria-label="גרף יומי ${esc(x.symbol)}"><line x1="0" x2="95" y1="${y(baseline)}" y2="${y(baseline)}" stroke="#8fa4b5" stroke-dasharray="3 3"/><polyline points="${points}" fill="none" stroke="${vals.at(-1)>=baseline?'#15947f':'#d13c53'}" stroke-width="2"/></svg>`}
function validIntraday(x){return x.intradaySessionDate===x.quoteSessionDate&&x.intradaySource===x.quoteSource?x.intraday||[]:[]}
function stockMoney(x,v){return x.currency==='ILA'?fmt(v)+' אג׳':money(v,x.currency||'USD')}
function portfolioCurrency(){const c=[...new Set(state.items.filter(holding).map(x=>x.currency||'USD'))];return c.length>1?null:c[0]||'USD'}
const periods={day:'יום',week:'שבוע',month:'חודש',year:'שנה',all:'כללי'},days={week:7,month:30,year:365};
function periodButtons(){return '<div class="periods" role="group" aria-label="תקופה">'+Object.entries(periods).map(([key,label])=>`<button type="button" data-period="${key}" class="${period===key?'active':''}">${label}</button>`).join('')+'</div>'}
function basePrice(x,p){if(p==='day')return Number(x.prevClose)>0&&Number(x.quoteTime)>0&&Date.now()-Number(x.quoteTime)<4*86400000?Number(x.prevClose):null;if(p==='all')return Number(x.avg)>0?Number(x.avg):null;const dates=x.historyDates||[],prices=x.history||[];if(!dates.length||dates.length!==prices.length||x.historySource!==x.quoteSource)return null;const target=new Date(Date.now()-days[p]*86400000).toISOString().slice(0,10);let i=-1;for(let j=0;j<dates.length;j++)if(String(dates[j]).slice(0,10)<=target)i=j;return i>=0&&(Date.parse(target)-Date.parse(String(dates[i]).slice(0,10))<=7*86400000)?Number(prices[i]):null}
function metric(current,baseline){if(!(baseline>0)||!(current>0))return null;return {money:current-baseline,pct:(current/baseline-1)*100}}
function metricText(m){if(!m)return '—';const n=changeMode==='money'?m.money:m.pct;return (n>=0?'+':'')+(changeMode==='money'?money(n):fmt(n)+'%')}
function metricClass(m){return !m?'neutral':m.money>=0?'positive':'negative'}
function quoteStamp(x){if(!x.quoteTime||!Number.isFinite(Number(x.quoteTime)))return 'שער שמור · '+(x.priceDate||'ללא תאריך');const d=new Date(Number(x.quoteTime)).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});return `${x.quoteSource||''} · ${d} · ${x.quoteKind==='close'?'סגירה':x.quoteKind==='reference'?'שער מחושב':'מסחר'}${x.quoteError?' · עדכון נכשל':x.quoteFallback?' · גיבוי':''}` }
function portfolioMetric(p){const held=state.items.filter(holding);if(!held.length||!portfolioCurrency())return null;if(p==='day'&&new Set(held.map(x=>x.quoteSessionDate)).size>1)return null;if(p==='all')return held.every(x=>Number(x.avg)>0)?metric(total(),cost()):null;let baseline=0;for(const x of held){const v=basePrice(x,p);if(!(v>0))return null;baseline+=v*Number(x.qty)}return metric(total(),baseline)}
function portfolioSeries(){const held=state.items.filter(holding);if(!held.length||!portfolioCurrency())return [];if(period==='day'){if(held.some(x=>validIntraday(x).length<2)||new Set(held.map(x=>x.intradaySessionDate)).size!==1)return [];const maps=held.map(x=>new Map(validIntraday(x).map(p=>[p.time,p])));return [...maps[0].keys()].filter(t=>maps.every(m=>m.has(t))).sort((a,b)=>a-b).map(t=>({time:t,date:maps[0].get(t).date,value:held.reduce((n,x,i)=>n+Number(x.qty)*maps[i].get(t).value,0)}))}if(held.some(x=>x.historySource!==x.quoteSource))return [];const maps=held.map(x=>new Map((x.historyDates||[]).map((d,i)=>[String(d).slice(0,10),Number(x.history?.[i])])));if(maps.some(m=>!m.size))return [];const cutoff=period==='all'?'0000':new Date(Date.now()-days[period]*86400000).toISOString().slice(0,10);const dates=[...maps[0].keys()].filter(d=>d>=cutoff&&maps.every(m=>m.has(d))).sort();return dates.map(d=>({date:d,value:held.reduce((sum,x,i)=>sum+Number(x.qty)*maps[i].get(d),0)})).filter(p=>p.value>0)}
function axisDate(value){const d=String(value||'');if(/^\d{4}-\d{2}-\d{2}/.test(d)){const date=new Date(d.slice(0,10)+'T12:00:00Z');return date.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}return d||'—'}
function lineChart(points,label){if(points.length<2)return '<div class="chart-empty">ממתין לנתוני גרף מתאימים לכל האחזקות.</div>';const vals=points.map(p=>Number(p.value)),min=Math.min(...vals),max=Math.max(...vals),pad=min===max?Math.max(Math.abs(min)*.005,.01):0,low=min-pad,high=max+pad,span=high-low,x=i=>10+(points.at(-1).time>points[0].time?(points[i].time-points[0].time)/(points.at(-1).time-points[0].time):i/(points.length-1))*325,y=v=>170-(v-low)/span*135,coordinates=vals.map((v,i)=>x(i)+','+y(v)).join(' '),ticks=[high,(high+low)/2,low],horizontal=ticks.map(v=>`<line x1="10" x2="335" y1="${y(v)}" y2="${y(v)}" stroke="#587083" stroke-opacity=".38" stroke-dasharray="4 5"/><text x="435" y="${y(v)+4}" text-anchor="end">${fmt(v,2)}</text>`).join(''),indices=[0,Math.floor((points.length-1)/2),points.length-1],labels=[...new Set(indices)].map(i=>`<text x="${x(i)}" y="205" text-anchor="${i===0?'start':i===points.length-1?'end':'middle'}">${esc(axisDate(points[i].date))}</text>`).join('');return `<svg class="dashboard-chart" viewBox="0 0 440 218" preserveAspectRatio="none" role="img" aria-label="${esc(label)}" direction="ltr"><line x1="10" x2="335" y1="170" y2="170" stroke="#587083"/>${horizontal}<polyline points="${coordinates}" fill="none" stroke="${vals.at(-1)>=vals[0]?'#15947f':'#d13c53'}" stroke-width="3" vector-effect="non-scaling-stroke"/>${labels}</svg>`}
function basicList(){let items=state.items.filter(x=>listFilter==='holdings'?holding(x):listFilter==='watchlist'?!holding(x):true);if(!reorderMode)items=[...items].sort((a,b)=>listSort==='price'?price(b)-price(a):listSort==='change'?(Number(b.dayChange)||0)-(Number(a.dayChange)||0):listSort==='value'?value(b)-value(a):listSort==='symbol'?a.symbol.localeCompare(b.symbol):0);return `<section class="card wide stock-card"><div class="list-heading"><h2>${esc(state.name||'תיק השקעות')} <small>${items.length}</small></h2><div class="list-actions"><button class="btn mode-btn" id="changeMode" aria-label="שינוי תצוגת שער לאחוזים או כסף">${changeMode==='percent'?'%':'$'} ⇄</button><button class="icon-btn filter-toggle" id="filterToggle" aria-expanded="${filtersOpen}" aria-label="סינון ומיון מניות" title="סינון ומיון">☷</button></div></div><div class="basic-controls ${filtersOpen?'':'collapsed'}"><select id="listFilter" aria-label="סינון" ${reorderMode?'disabled':''}><option value="all" ${listFilter==='all'?'selected':''}>הכול (${state.items.length})</option><option value="holdings" ${listFilter==='holdings'?'selected':''}>אחזקות (${state.items.filter(holding).length})</option><option value="watchlist" ${listFilter==='watchlist'?'selected':''}>מעקב (${state.items.filter(x=>!holding(x)).length})</option></select><select id="listSort" aria-label="מיון" ${reorderMode?'disabled':''}><option value="manual" ${listSort==='manual'?'selected':''}>הסדר שלי</option><option value="symbol" ${listSort==='symbol'?'selected':''}>מיון: סימול</option><option value="change" ${listSort==='change'?'selected':''}>שינוי יומי</option><option value="price" ${listSort==='price'?'selected':''}>שער</option><option value="value" ${listSort==='value'?'selected':''}>שווי אחזקה</option></select><button class="btn edit-sort ${reorderMode?'active':''}" id="toggleReorder" aria-pressed="${reorderMode}">${reorderMode?'סיום סידור':'סידור מניות'}</button></div>${items.length?`<div class="basic-list" id="stockList">${items.map(x=>{const m=metric(price(x),basePrice(x,'day'));return `<div class="basic-line ${reorderMode?'reordering':''}" data-symbol="${esc(x.symbol)}" ${reorderMode?'':'role="button" tabindex="0" data-open="'+esc(x.symbol)+'"'}><span class="sort-handle" aria-label="גרור לשינוי סדר">☰</span><span><span class="symbol" dir="ltr">${esc(x.symbol)}</span><span class="status-icon" aria-label="${holding(x)?'אחזקה':'מעקב'}" title="${holding(x)?'אחזקה':'מעקב'}">${holding(x)?'◆':'☆'}</span><div class="small">${esc(x.name||'')}</div></span>${reorderMode?'':`<span>${miniChart(x)}</span>`}<span class="basic-quote"><span class="last number">${x.price?fmt(x.price):'—'}</span><span class="change ${metricClass(m)}">${metricText(m)}</span><span class="quote-age">${esc(quoteStamp(x))}</span></span></div>`}).join('')}</div>`:'<div class="empty">אין מניות בסינון זה.</div>'}</section>`}
function metricBoth(m){if(!m)return '—';const sign=m.money>=0?'+':'',pctSign=m.pct>=0?'+':'';return `<span class="change-money">${sign}${stockMoney({currency:portfolioCurrency()||'USD'},m.money)}</span> <span class="change-percent">(${pctSign}${fmt(m.pct)}%)</span>`}
function overview(){const m=portfolioMetric(period),series=portfolioSeries();return `<div class="grid"><section class="card wide dashboard"><div class="dashboard-top"><div><label>שווי אחזקות · ${esc(state.name||'תיק השקעות')}</label><strong class="number">${portfolioCurrency()?stockMoney({currency:portfolioCurrency()},total()):'מטבעות שונים'}</strong></div><div class="dashboard-change ${metricClass(m)}">${metricBoth(m)} <small>${period==='all'?'רווח לא ממומש':periods[period]}</small></div></div>${periodButtons()}${quoteStatus?`<div class="quote-notice">${esc(quoteStatus)} <button class="btn" id="setupQuotes">הגדרת שערים</button></div>`:''}${lineChart(series,'שווי תיק לאורך התקופה')}<p class="note">${period==='all'?'כללי: רווח לא ממומש ביחס לעלות הקנייה; אינו תשואה כוללת. הגרף מציג עד כשנה של מחירי עבר.':period==='day'?'שינוי מול סגירה קודמת. גרף המסחר מציג זמנים משותפים לאחזקות, לפי הכמויות הנוכחיות; שעות הבורסה.':'חישוב לפי כמויות האחזקה הנוכחיות, ללא קניות ומכירות בתקופה.'}</p></section>${basicList()}</div>`}
function allocation(){let a=state.items.filter(x=>value(x)>0).sort((x,y)=>value(y)-value(x));if(!a.length)return '<div class="chart-empty">הוסף כמות ומחיר כדי לראות את חלוקת התיק</div>';return `<div style="display:flex;height:24px;border-radius:8px;overflow:hidden;direction:ltr">${a.map((x,i)=>`<div style="width:${100*value(x)/total()}%;background:${['#41c6ae','#527edf','#8e70e1','#e9aa62','#e7799b','#73b8dc'][i%6]}" title="${esc(x.symbol)} ${fmt(value(x)/total()*100,1)}%"></div>`).join('')}</div>${a.slice(0,6).map((x,i)=>`<div class="row"><span><span style="display:inline-block;width:9px;height:9px;background:${['#41c6ae','#527edf','#8e70e1','#e9aa62','#e7799b','#73b8dc'][i%6]};border-radius:50%;margin-left:8px"></span><b dir="ltr">${esc(x.symbol)}</b></span><span class="number">${fmt(value(x)/total()*100,1)}% · ${money(value(x))}</span></div>`).join('')}`}
function table(items){if(!items.length)return '<div class="empty">אין מניות עדיין. אפשר להוסיף מניה אחת או לייבא רשימת סימולים.</div>';return `<div class="tablewrap"><table><thead><tr><th>מניה</th><th>סטטוס</th><th>כמות</th><th>עלות ממוצעת</th><th>מחיר אחרון</th><th>שווי</th><th>רווח / הפסד</th><th></th></tr></thead><tbody>${items.map(x=>{let pl=value(x)-Number(x.qty)*Number(x.avg);return `<tr><td><b class="ticker">${esc(x.symbol)}</b><div class="small">${esc(x.name||'')}</div></td><td><span class="pill">${holding(x)?'בתיק':'במעקב'}</span></td><td class="number">${x.qty?fmt(x.qty,4):'—'}</td><td class="number">${x.avg?money(x.avg):'—'}</td><td class="number">${x.price?money(x.price):'—'}<div class="small">${esc(x.quoteSource==='Tiingo'?'Tiingo · '+new Date(Number(x.quoteTime)||0).toLocaleString('he-IL'):x.quoteSource==='Finnhub'?'Finnhub · '+new Date(Number(x.quoteTime)||0).toLocaleString('he-IL'):x.priceDate||'מחיר שמור')}</div></td><td class="number">${holding(x)?money(value(x)):'—'}</td><td class="number ${pl>=0?'positive':'negative'}">${holding(x)&&x.avg&&x.price?money(pl):'—'}</td><td><button class="btn" data-open="${esc(x.symbol)}">פרטים</button></td></tr>`}).join('')}</tbody></table></div>`}
function listing(kind){let items=state.items.filter(x=>kind==='portfolio'?holding(x):!holding(x));return `<div class="grid"><section class="card wide"><div class="row"><h2>${kind==='portfolio'?'תיק ההשקעות':'רשימת מעקב'}</h2><span class="small">${items.length} ניירות</span></div>${table(items)}</section></div>`}
function dataRow(label,result){return `<div class="row"><span>${label}</span><b class="number">${result}</b></div>`}
function compactNumber(n){return Number.isFinite(n)?new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n):'—'}
function stockStatistics(x){const dates=x.historyDates||[],limit=new Date(Date.now()-365*86400000).toISOString().slice(0,10),low=(x.historyLow||[]).filter((v,i)=>dates[i]>=limit&&Number(v)>0),high=(x.historyHigh||[]).filter((v,i)=>dates[i]>=limit&&Number(v)>0),three=new Date(Date.now()-90*86400000).toISOString().slice(0,10),vol=(x.historyVolume||[]).filter((v,i)=>dates[i]>=three&&Number(v)>0);return `<section class="card wide"><h2>נתוני שוק</h2>${dataRow('סגירה קודמת',basePrice(x,'day')?money(x.prevClose):'—')}${dataRow('פתיחה',x.marketOpen?money(x.marketOpen):'—')}${dataRow('טווח יומי',x.marketLow>0&&x.marketHigh>0?money(x.marketLow)+' – '+money(x.marketHigh):'—')}${dataRow('טווח 52 שבועות',low.length&&high.length?money(Math.min(...low))+' – '+money(Math.max(...high)):'—')}${dataRow('נפח מסחר',compactNumber(x.marketVolume))}${dataRow('נפח ממוצע · 3 חודשים',vol.length>=20?compactNumber(vol.reduce((a,b)=>a+b,0)/vol.length):'—')}<p class="note">נתוני היום מ־${esc(x.quoteSource||'שער שמור')}. טווח 52 השבועות והנפח הממוצע מחושבים מהיסטוריית סוף יום כאשר היא זמינה.</p></section>`}
function stockHoldings(x){if(!holding(x))return '<section class="card wide"><div class="empty">המניה במעקב. הוסף כמות ומחיר קנייה כדי לראות את האחזקה.</div></section>';const basis=Number(x.qty)*Number(x.avg),gain=value(x)-basis;return `<section class="card wide"><h2>האחזקה שלי</h2>${dataRow('כמות',fmt(x.qty,4))}${dataRow('עלות ממוצעת למניה',x.avg?money(x.avg):'—')}${dataRow('עלות כוללת',basis?money(basis):'—')}${dataRow('שווי נוכחי',money(value(x)))}${dataRow('שינוי יומי באחזקה',metricText(metric(value(x),Number(x.qty)*basePrice(x,'day'))))}${dataRow('רווח / הפסד לא ממומש',basis?money(gain)+' ('+fmt(gain/basis*100,2)+'%)':'—')}<p class="note">עלות ממוצעת וכמות נוכחית; ללא עמלות, דיבידנדים ומכירות קודמות.</p></section>`}
function extendedQuote(x){const e=x.extended;if(!e||e.source!==x.quoteSource||e.time<=x.quoteTime||Date.now()-e.time>4*86400000)return '';return `<p class="note">${e.kind==='pre'?'מסחר מוקדם':'מסחר מאוחר'} · <b dir="ltr">${stockMoney(x,e.price)} (${fmt((e.price/price(x)-1)*100)}%)</b> · ${new Date(e.time).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</p>`}
function stockSummary(x){const daily=metric(price(x),basePrice(x,'day'));return `<section class="card wide stock-hero"><div class="stock-price"><strong class="number">${price(x)?stockMoney(x,price(x)):'—'}</strong><span class="${metricClass(daily)}">${metricText(daily)} היום</span></div><p class="note">${esc(quoteStamp(x))} · ${esc(x.currency==='ILA'?'אגורות':x.currency||'מטבע לא ידוע')}</p>${extendedQuote(x)}${periodButtons()}<div class="stock-period"><strong class="${metricClass(metric(price(x),basePrice(x,period)))}">${metricText(metric(price(x),basePrice(x,period)))}</strong><span class="small">${period==='all'?'מול עלות ממוצעת':periods[period]}</span></div><h3>גרף מחירים</h3>${chart(x)}<p class="note">${period==='day'?`מסחר רגיל · ${esc(x.intradaySessionDate||'')} · שעות ${esc(x.exchangeTimezone||'הבורסה')} · ${esc(x.intradaySource||'')}`:x.historySource?`מחירי סגירה יומיים · ${esc(x.historySource)}`:'גרף יופיע לאחר טעינת היסטוריה.'}</p></section>${holding(x)?`<section class="card wide"><h2>האחזקה שלי</h2>${dataRow('שווי אחזקה',money(value(x)))}${dataRow('שינוי היום',metricText(metric(value(x),Number(x.qty)*basePrice(x,'day'))))}</section>`:''}`}

$('#content').addEventListener('pointerdown',e=>{if(!reorderMode||!e.target.closest('.sort-handle'))return;const row=e.target.closest('.basic-line'),list=$('#stockList');if(!row||!list)return;e.preventDefault();row.classList.add('dragging');let changed=false;const move=ev=>{ev.preventDefault();const other=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.basic-line');if(other&&other!==row&&other.parentElement===list){const r=other.getBoundingClientRect();list.insertBefore(row,ev.clientY<r.top+r.height/2?other:other.nextSibling);changed=true}};const end=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);row.classList.remove('dragging');if(changed){const order=[...list.children].map(el=>el.dataset.symbol);state.items.sort((a,b)=>order.indexOf(a.symbol)-order.indexOf(b.symbol));save();render()}};document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end,{once:true});document.addEventListener('pointercancel',end,{once:true})});
window.loadPortfolio=(user,portfolio)=>{KEY='financial-center-firebase-'+user.uid;book=normalizeBook(portfolio);let restoreLocal=false;try{const cache=JSON.parse(localStorage.getItem(KEY)||'null');restoreLocal=!!(cache?.portfolios?.length&&(localStorage.getItem(KEY+'-pending')||((portfolio?.portfolios?.length===1)&&(cache.portfolios.length===1)&&(cache.portfolios[0].id!==portfolio.portfolios[0].id))));if(restoreLocal)book=normalizeBook(cache);for(const section of book.portfolios){const prior=cache?.portfolios?.find(x=>x.id===section.id);for(const item of section.items){const saved=prior?.items?.find(x=>x.symbol===item.symbol);if(saved){for(const prefix of ['history','intraday'])if(['Yahoo','Tiingo'].includes(saved[prefix+'Source']))for(const key of Object.keys(saved).filter(k=>k.startsWith(prefix)))item[key]=saved[key]}}}}catch{}state=currentPortfolio();remoteReady=true;$('#add').disabled=false;$('#import').disabled=false;$('#quotes').disabled=false;$('#refreshQuotes').disabled=false;$('#signin').hidden=true;$('#signout').hidden=false;localStorage.setItem(KEY,JSON.stringify(book));$('#sync').textContent='מסונכרן';render();if(restoreLocal||!Array.isArray(portfolio?.portfolios))save();window.marketQuotes?.onPortfolioLoaded(user.uid)};
window.unloadPortfolio=()=>{remoteReady=false;KEY='';book={portfolios:[],activePortfolioId:''};state={items:[],alerts:[]};$('#add').disabled=true;$('#import').disabled=true;$('#quotes').disabled=true;$('#refreshQuotes').disabled=true;window.marketQuotes?.onSignOut();$('#signin').hidden=false;$('#signout').hidden=true;$('#sync').textContent='יש להתחבר';render()};

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
let installPrompt;window.addEventListener('beforeinstallprompt', event => {event.preventDefault();installPrompt=event;document.getElementById('install').hidden=false});
document.getElementById('install').addEventListener('click', async () => {if (!installPrompt) return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('install').hidden=true});
window.addEventListener('appinstalled', () => document.getElementById('install').hidden=true);
</script><script type="module" src="./firebase.js"></script></body></html>
