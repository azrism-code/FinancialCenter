name: Deploy Cloudflare quote relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Wrangler
        run: |
          npm install --prefix "$RUNNER_TEMP/financial-center-worker" --no-audit --no-fund wrangler@4.92.0
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/financial-center-worker/node_modules/.bin/wrangler" deploy --config worker/wrangler.jsonc
