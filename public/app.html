<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1727"><title>Financial Center</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#e9f0f7;background:#081321;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:68px;border-bottom:1px solid #263a4d;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1360px)/2));background:#0b192a}.brand{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}.brand b{color:#57d6be}.badge{font-size:.78rem;color:#9db2c7;border:1px solid #34495f;padding:7px 11px;border-radius:20px}main{max-width:1360px;margin:auto;padding:26px 20px 80px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{color:#57d6be;font-size:.82rem;font-weight:bold;letter-spacing:.12em}h1{font-size:2rem;margin:8px 0 5px;letter-spacing:-.04em}.muted{color:#9fb1c3}.actions{display:flex;gap:8px}.btn{border:1px solid #40576c;border-radius:10px;background:#14283a;color:#eef7fc;padding:10px 14px}.btn.primary{background:#33bda5;color:#06221e;border-color:#33bda5;font-weight:700}.btn:hover{filter:brightness(1.13)}.tabs{display:flex;gap:5px;border-bottom:1px solid #2a4054;margin-bottom:20px;overflow:auto}.tabs button{border:0;background:none;color:#a9bacb;padding:13px 18px;white-space:nowrap}.tabs button.active{color:#65e1c9;border-bottom:2px solid #65e1c9}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:#102235;border:1px solid #284055;border-radius:16px;padding:20px;min-width:0}.stat{grid-column:span 3}.stat label{display:block;color:#a7bacc;font-size:.85rem}.stat strong{display:block;font-size:1.6rem;margin-top:10px;font-variant-numeric:tabular-nums}.stat small{color:#9fb1c3}.chartcard{grid-column:span 8}.side{grid-column:span 4}.wide{grid-column:span 12}.half{grid-column:span 6}.card h2{font-size:1.05rem;margin:0 0 16px}.positive{color:#61dbac}.negative{color:#ff8190}.chart{width:100%;height:210px;display:block}.chart-empty{min-height:210px;display:grid;place-items:center;border:1px dashed #3a5367;border-radius:12px;color:#9fb1c3;text-align:center;padding:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #274054}.row:last-child{border:0}.ticker{font-weight:800;direction:ltr;text-align:left}.small{font-size:.82rem;color:#9fb1c3}.number{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}.empty{padding:26px;text-align:center;color:#a9bccc;border:1px dashed #40566a;border-radius:12px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:right}th{font-size:.8rem;color:#96aabd;font-weight:600}td,th{padding:14px 10px;border-bottom:1px solid #294052}td:nth-child(n+3){direction:ltr;text-align:right}input,select,textarea{background:#0b1b2c;color:#f2f8fc;border:1px solid #456075;border-radius:9px;padding:10px;width:100%;min-width:0}input:focus,select:focus{outline:2px solid #42c8b0}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}.form label{display:block;color:#a9bccc;font-size:.8rem;margin-bottom:6px}.form button{height:42px}.note{font-size:.83rem;color:#9eb1c4;line-height:1.6}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#243b4d;color:#b8d0db;font-size:.76rem}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools input{max-width:220px}.alert{background:#163047;border-right:3px solid #4ec7b2;padding:13px;border-radius:8px;margin-bottom:10px}.danger{color:#ff9da5}.spark{width:100%;height:160px}.dialog{position:fixed;inset:0;background:#020b13bb;display:grid;place-items:center;padding:15px;z-index:2}.dialog>div{background:#12283a;border:1px solid #4b6275;padding:24px;border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.dialog .form{grid-template-columns:1fr 1fr}.dialog .actions{margin-top:20px;justify-content:flex-end}a{color:#67dec9}footer{margin-top:30px;color:#7990a4;font-size:.8rem}svg text{fill:#a8b9ca;font-size:11px} @media(max-width:850px){.stat{grid-column:span 6}.chartcard,.side,.half{grid-column:span 12}}@media(max-width:600px){header{padding:0 16px}.badge{font-size:.7rem}main{padding:18px 12px 65px}.top{align-items:start;flex-direction:column}h1{font-size:1.55rem}.stat{grid-column:span 6;padding:14px}.stat strong{font-size:1.25rem}.card{padding:15px}.form{grid-template-columns:1fr 1fr}.form button{grid-column:span 2}.dialog .form{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body><header><div class="brand">FINANCIAL <b>CENTER</b></div><span class="badge"><span id="sync">טוען תיק...</span></span></header><main><div class="top"><div><div class="eyebrow">PORTFOLIO INTELLIGENCE</div><h1>התמונה הפיננסית שלך</h1><div class="muted" id="date"></div></div><div class="actions"><button class="btn" id="import">ייבוא רשימה</button><button class="btn primary" id="add">+ הוספת מניה</button></div></div><nav class="tabs" aria-label="ניווט"><button data-tab="overview" class="active">סקירה</button><button data-tab="portfolio">תיק ההשקעות</button><button data-tab="watchlist">רשימת מעקב</button><button data-tab="research">ניתוח וגרפים</button><button data-tab="alerts">התראות</button></nav><div id="content"></div><footer>תיק ראשוני מייצוא Yahoo מתאריך 23/09/2026. שינויים נשמרים בחשבון הפרטי ומגובים בדפדפן. אין עדיין חיבור למחירי שוק או שליחת התראות. רמות טכניות הן חישוב על בסיס נתונים שהוזנו ואינן הוראת מסחר.</footer></main><div id="modal"></div>
<script>
const $=s=>document.querySelector(s);let KEY='';let remoteReady=false;let state={items:[],alerts:[]};$('#add').disabled=true;$('#import').disabled=true;if(!Array.isArray(state.items))state.items=[];if(!Array.isArray(state.alerts))state.alerts=[];let tab='overview',selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=(n,d=2)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d}),save=()=>{localStorage.setItem(KEY,JSON.stringify(state));if(remoteReady){document.getElementById('sync').textContent='שומר...';fetch('/api/portfolio',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(state)}).then(r=>{if(!r.ok)throw Error('save failed');document.getElementById('sync').textContent='מסונכרן'}).catch(()=>{document.getElementById('sync').textContent='השמירה בענן נכשלה · נשמר במכשיר'})}},holding=x=>Number(x.qty)>0,stock=()=>state.items.find(x=>x.symbol===selected),money=(v,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:2}).format(v||0);
$('#date').textContent=new Intl.DateTimeFormat('he-IL',{dateStyle:'full'}).format(new Date());
function price(x){return Number(x.price)||0}function value(x){return price(x)*(Number(x.qty)||0)}function total(){return state.items.reduce((a,x)=>a+value(x),0)}function cost(){return state.items.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.avg)||0),0)}
function overview(){let t=total(),c=cost(),p=t-c;return `<div class="grid"><div class="card stat"><label>שווי תיק מחושב</label><strong class="number">${money(t)}</strong><small>לפי המחירים השמורים, שאינם נתוני זמן אמת</small></div><div class="card stat"><label>רווח / הפסד לא ממומש</label><strong class="number ${p>=0?'positive':'negative'}">${money(p)}</strong><small>${c?fmt(p/c*100,1):'—'}% מעלות הקנייה</small></div><div class="card stat"><label>החזקות</label><strong>${state.items.filter(holding).length}</strong><small>ניירות בתיק</small></div><div class="card stat"><label>במעקב</label><strong>${state.items.filter(x=>!holding(x)).length}</strong><small>ניירות ללא כמות</small></div><section class="card chartcard"><h2>חלוקת התיק</h2>${allocation()}</section><section class="card side"><h2>דורש תשומת לב</h2>${state.items.length?'<div class="alert">מחירי השוק והחדשות עדיין אינם מחוברים. כדי לקבל תובנות חיות והתראות, נחבר ספק נתונים ומנוע רקע.</div>':'<div class="empty">הוסף מניות כדי להתחיל לעקוב אחר התיק.</div>'}<p class="note">סקירת סוף יום והתראות בזמן מסחר יופיעו כאן אחרי חיבור נתונים חי.</p></section><section class="card wide"><h2>הניירות שלך</h2>${table(state.items.slice(0,8))}</section></div>`}
function allocation(){let a=state.items.filter(x=>value(x)>0).sort((x,y)=>value(y)-value(x));if(!a.length)return '<div class="chart-empty">הוסף כמות ומחיר כדי לראות את חלוקת התיק</div>';return `<div style="display:flex;height:24px;border-radius:8px;overflow:hidden;direction:ltr">${a.map((x,i)=>`<div style="width:${100*value(x)/total()}%;background:${['#41c6ae','#527edf','#8e70e1','#e9aa62','#e7799b','#73b8dc'][i%6]}" title="${esc(x.symbol)} ${fmt(value(x)/total()*100,1)}%"></div>`).join('')}</div>${a.slice(0,6).map((x,i)=>`<div class="row"><span><span style="display:inline-block;width:9px;height:9px;background:${['#41c6ae','#527edf','#8e70e1','#e9aa62','#e7799b','#73b8dc'][i%6]};border-radius:50%;margin-left:8px"></span><b dir="ltr">${esc(x.symbol)}</b></span><span class="number">${fmt(value(x)/total()*100,1)}% · ${money(value(x))}</span></div>`).join('')}`}
function table(items){if(!items.length)return '<div class="empty">אין מניות עדיין. אפשר להוסיף מניה אחת או לייבא רשימת סימולים.</div>';return `<div class="tablewrap"><table><thead><tr><th>מניה</th><th>סטטוס</th><th>כמות</th><th>עלות ממוצעת</th><th>מחיר שמור</th><th>שווי</th><th>רווח / הפסד</th><th></th></tr></thead><tbody>${items.map(x=>{let pl=value(x)-Number(x.qty)*Number(x.avg);return `<tr><td><b class="ticker">${esc(x.symbol)}</b><div class="small">${esc(x.name||'')}</div></td><td><span class="pill">${holding(x)?'בתיק':'במעקב'}</span></td><td class="number">${x.qty?fmt(x.qty,4):'—'}</td><td class="number">${x.avg?money(x.avg):'—'}</td><td class="number">${x.price?money(x.price):'—'}</td><td class="number">${holding(x)?money(value(x)):'—'}</td><td class="number ${pl>=0?'positive':'negative'}">${holding(x)&&x.avg&&x.price?money(pl):'—'}</td><td><button class="btn" data-open="${esc(x.symbol)}">פרטים</button></td></tr>`}).join('')}</tbody></table></div>`}
function listing(kind){let items=state.items.filter(x=>kind==='portfolio'?holding(x):!holding(x));return `<div class="grid"><section class="card wide"><div class="row"><h2>${kind==='portfolio'?'תיק ההשקעות':'רשימת מעקב'}</h2><span class="small">${items.length} ניירות</span></div>${table(items)}</section></div>`}
function research(){let x=stock()||state.items[0];if(x)selected=x.symbol;return `<div class="grid"><section class="card wide"><div class="tools"><h2 style="margin:0;margin-left:auto">ניתוח מניה</h2><select id="pick" style="max-width:230px">${state.items.map(y=>`<option value="${esc(y.symbol)}" ${x&&y.symbol===x.symbol?'selected':''}>${esc(y.symbol)}</option>`).join('')}</select></div></section>${!x?'<section class="card wide"><div class="empty">הוסף מניה כדי לפתוח ניתוח וגרף.</div></section>':`<section class="card chartcard"><h2>${esc(x.symbol)} · גרף מחירים</h2>${x.history?.length>=2?chart(x):'<div class="chart-empty">כדי לראות גרף, הוסף היסטוריית מחירי סגירה בחלון העריכה.<br>מחיר יחיד אינו יוצר גרף.</div>'}<p class="note">הגרף מבוסס על מחירים שהוזנו ידנית, לפי סדר הימים. אינו זרם מחירי שוק.</p></section><section class="card side"><h2>רמות ומדדי סיכון</h2>${technical(x)}</section><section class="card wide"><div class="tools"><button class="btn primary" data-edit="${esc(x.symbol)}">עריכת נתונים</button><button class="btn" data-remove="${esc(x.symbol)}">מחיקה</button></div></section>`}</div>`}
function chart(x){let vals=x.history,lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1,pts=vals.map((v,i)=>`${20+i*660/(vals.length-1)},${180-(v-lo)/span*140}`).join(' ');return `<svg class="chart" viewBox="0 0 700 210" preserveAspectRatio="none" aria-label="גרף מחירי סגירה"><line x1="20" y1="180" x2="680" y2="180" stroke="#40576b"/><line x1="20" y1="40" x2="680" y2="40" stroke="#294154" stroke-dasharray="4"/><polyline points="${pts}" fill="none" stroke="#52dcc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="28">${fmt(hi)}</text><text x="22" y="199">${fmt(lo)}</text></svg>`}
function technical(x){let h=x.history||[],v=price(x)||h.at(-1)||0;if(h.length<3)return '<p class="note">נדרשים לפחות שלושה מחירי סגירה כדי לחשב רמות ראשוניות. הוסף סדרת מחירים.</p>';let prior=h.slice(0,-1),res=Math.max(...prior),sup=Math.min(...prior),last=h.at(-1),changes=h.slice(1).map((v,i)=>Math.abs(v-h[i])),vol=changes.reduce((a,b)=>a+b,0)/changes.length;let breakout=last>res;return `<div class="row"><span>התנגדות קודמת</span><b class="number">${money(res)}</b></div><div class="row"><span>תמיכה בטווח שהוזן</span><b class="number">${money(sup)}</b></div><div class="row"><span>מחיר סגירה אחרון</span><b class="number ${breakout?'positive':''}">${money(last)}</b></div><div class="row"><span>פריצה מעל שיא קודם</span><b>${breakout?'כן, לפי סגירות':'לא'}</b></div><div class="row"><span>מרחק מתמיכה</span><b class="number">${fmt((last-sup)/last*100,1)}%</b></div><p class="note">טווח סגירות בלבד; פריצה אינה מאומתת בנפח מסחר. תנודה יומית ממוצעת פשוטה: ${money(vol)}. רמת תמיכה או סטופ אינה מבטיחה מחיר ביצוע, ובפערי פתיחה עשויה להתבצע נמוך יותר.</p>`}
function alerts(){return `<div class="grid"><section class="card half"><h2>התראות מחיר אישיות</h2><form id="alertform" class="form"><div><label>מניה</label><select name="symbol" required>${state.items.map(x=>`<option>${esc(x.symbol)}</option>`).join('')}</select></div><div><label>כיוון</label><select name="direction"><option value="above">מעל</option><option value="below">מתחת</option></select></div><div><label>מחיר יעד ($)</label><input name="target" type="number" step="0.01" min="0.01" required></div><button class="btn primary" ${state.items.length?'':'disabled'}>הוסף התראה</button></form><p class="note">התראות אלה נבדקות כרגע רק כאשר מזינים מחיר באפליקציה. אין Push או בדיקות ברקע.</p>${state.alerts.map((a,i)=>`<div class="row"><span dir="ltr">${esc(a.symbol)} ${a.direction==='above'?'≥':'≤'} ${money(a.target)}</span><button class="btn" data-delalert="${i}">הסר</button></div>`).join('')}</section><section class="card half"><h2>התראות אירועים וסוף יום</h2><div class="empty">חיבור חדשות, דוחות, דירוגי אנליסטים ומחירים רציפים נמצא בשלב הבא. כאן יופיעו אירועים מאומתים עם מקור ושעת פרסום.</div></section></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#content').innerHTML=({overview,portfolio:()=>listing('portfolio'),watchlist:()=>listing('watchlist'),research,alerts})[tab]();$('#pick')?.addEventListener('change',e=>{selected=e.target.value;render()});$('#alertform')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);state.alerts.push({symbol:f.get('symbol'),direction:f.get('direction'),target:Number(f.get('target'))});save();render()})}
function editor(symbol){let x=state.items.find(y=>y.symbol===symbol)||{};$('#modal').innerHTML=`<div class="dialog"><div role="dialog" aria-modal="true" aria-label="עריכת מניה"><h2>${symbol?'עריכת מניה':'הוספת מניה'}</h2><form id="editform" class="form"><div><label>סימול *</label><input name="symbol" value="${esc(x.symbol||'')}" required pattern="[A-Za-z0-9.^_-]{1,20}" ${symbol?'readonly':''} placeholder="NVDA"></div><div><label>שם (רשות)</label><input name="name" value="${esc(x.name||'')}"></div><div><label>כמות מוחזקת</label><input name="qty" type="number" min="0" step="any" value="${esc(x.qty||'')}"></div><div><label>מחיר קנייה ממוצע ($)</label><input name="avg" type="number" min="0" step="any" value="${esc(x.avg||'')}"></div><div><label>מחיר אחרון שהזנת ($)</label><input name="price" type="number" min="0" step="any" value="${esc(x.price||'')}"></div><div style="grid-column:1/-1"><label>מחירי סגירה היסטוריים, מהישן לחדש (מופרדים בפסיק)</label><textarea name="history" rows="3" placeholder="100, 102, 99, 105">${esc((x.history||[]).join(', '))}</textarea></div><div class="actions" style="grid-column:1/-1"><button type="button" class="btn" id="cancel">ביטול</button><button class="btn primary">שמירה</button></div></form></div></div>`;$('#cancel').onclick=close;$('#editform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s=String(f.get('symbol')).toUpperCase().trim(),h=String(f.get('history')).trim();let hist=h?h.split(/[,\n;]+/).map(v=>Number(v.trim())):[];if(hist.some(v=>!Number.isFinite(v)||v<=0)){alert('מחירי הסגירה חייבים להיות מספרים חיוביים');return}if(!symbol&&state.items.some(y=>y.symbol===s)){alert('הסימול כבר קיים');return}let item={symbol:s,name:String(f.get('name')).trim(),qty:Number(f.get('qty'))||0,avg:Number(f.get('avg'))||0,price:Number(f.get('price'))||0,history:hist};if(symbol)state.items[state.items.findIndex(y=>y.symbol===symbol)]=item;else state.items.push(item);selected=s;save();close();render()}}
function close(){$('#modal').innerHTML=''}
function csvRows(raw){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<raw.length;i++){let c=raw[i];if(c==='"'){if(quoted&&raw[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('קובץ CSV אינו תקין');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
function numeric(v){let s=String(v??'').replace(/[$₪,\s]/g,'');if(!s||s==='—'||s==='-')return 0;let n=Number(s);return Number.isFinite(n)&&n>=0?n:0}
function parsePortfolioCsv(raw){let rows=csvRows(raw.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('לא נמצאו שורות נתונים');let headers=rows[0].map(v=>v.trim().toLowerCase()),find=(names)=>headers.findIndex(h=>names.some(n=>h===n||h.includes(n)));let si=find(['symbol','ticker','סימול']),ni=find(['company name','security name','name','שם']),qi=find(['quantity','shares','units','כמות']),ai=find(['purchase price','average cost basis','average cost','cost basis per share','מחיר קנייה']),pi=find(['current price','market price','last price','last trade price','מחיר אחרון']),ti=find(['transaction type','סוג עסקה']),di=find(['date','תאריך']);if(si<0)throw Error('לא נמצאה עמודת Symbol/Ticker. אפשר לייבא רשימת סימולים בהדבקה.');let map=new Map(),skipped=0;for(let r of rows.slice(1)){let symbol=String(r[si]||'').trim().toUpperCase();if(!/^[A-Z0-9.^_-]{1,20}$/.test(symbol)){skipped++;continue}let x=map.get(symbol);if(!x){x={symbol,name:'',qty:0,avg:0,price:0,history:[],priceDate:'',_buyQty:0,_buyCost:0,_transactions:false};map.set(symbol,x)}if(ni>=0&&r[ni])x.name=String(r[ni]).trim();if(pi>=0&&r[pi]){x.price=numeric(r[pi]);x.priceDate=di>=0?String(r[di]||'').trim():''}let q=qi<0?0:numeric(r[qi]),purchase=ai<0?0:numeric(r[ai]),type=ti<0?'':String(r[ti]||'').trim().toUpperCase();if(q){x._transactions=true;if(type==='SELL')x.qty-=q;else{x.qty+=q;x._buyQty+=q;x._buyCost+=q*purchase}}}let parsed=[...map.values()].map(x=>{x.avg=x._buyQty?x._buyCost/x._buyQty:0;delete x._buyQty;delete x._buyCost;delete x._transactions;return x});if(!parsed.length)throw Error('לא נמצאו סימולים תקינים');return {items:parsed,columns:{qty:qi>=0,avg:ai>=0,price:pi>=0},skipped,sourceDate:parsed.find(x=>x.priceDate)?.priceDate||''}}
$('#add').onclick=()=>editor();$('#import').onclick=()=>{$('#modal').innerHTML=`<div class="dialog"><div role="dialog" aria-modal="true"><h2>ייבוא מניות</h2><p class="note">בחר קובץ CSV שיוצא מ־Yahoo. לפני השמירה תראה אילו עמודות נקלטו. הנתונים נשארים בדפדפן שלך.</p><input id="csvfile" type="file" accept=".csv,text/csv"><div id="preview" class="note"></div><p class="note">או הדבק סימולים, כל אחד בשורה או מופרדים בפסיק:</p><textarea id="symbols" rows="5" placeholder="NVDA\nMSFT\nGOOGL"></textarea><div class="actions"><button class="btn" id="cancel">ביטול</button><button class="btn primary" id="apply">הוסף</button></div></div></div>`;let pending=null;$('#cancel').onclick=close;$('#csvfile').onchange=async e=>{pending=null;try{let f=e.target.files[0];if(!f)return;if(!/\.csv$/i.test(f.name))throw Error('יש לבחור קובץ CSV');pending=parsePortfolioCsv(await f.text());$('#preview').innerHTML=`<p>${pending.items.length} סימולים נקלטו, ${pending.items.filter(x=>x.qty>0).length} החזקות. כמות: ${pending.columns.qty?'כן':'לא'} · מחיר קנייה: ${pending.columns.avg?'כן':'לא'} · מחיר אחרון: ${pending.columns.price?'כן':'לא'}${pending.skipped?` · ${pending.skipped} שורות דולגו`:''}</p><p>${pending.items.slice(0,8).map(x=>esc(x.symbol)).join(', ')}</p><p>מחירי השוק הם צילום מצב מ־${esc(pending.sourceDate||'מועד הייצוא')}. כמות מכירות מופחתת מכמות קניות; עלות ממוצעת מחושבת מהקניות בלבד. ייבוא חוזר יעדכן סימולים קיימים.</p>`}catch(err){$('#preview').textContent=err.message}};$('#apply').onclick=()=>{let items;if(pending){items=pending.items}else{let list=$('#symbols').value.toUpperCase().split(/[\s,;]+/).filter(Boolean);if(list.length>100||list.some(s=>!(/^[A-Z0-9.^_-]{1,20}$/.test(s)))){alert('יש להזין עד 100 סימולים תקינים');return}items=list.map(symbol=>({symbol,name:'',qty:0,avg:0,price:0,history:[]}))}for(let x of items){let old=state.items.find(y=>y.symbol===x.symbol);if(old&&pending){if(x.name)old.name=x.name;if(pending.columns.qty)old.qty=x.qty;if(pending.columns.avg)old.avg=x.avg;if(pending.columns.price){old.price=x.price;old.priceDate=x.priceDate}}else if(!old)state.items.push(x)}save();close();tab='portfolio';render()}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#content').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open){selected=b.dataset.open;tab='research';render()}if(b.dataset.edit)editor(b.dataset.edit);if(b.dataset.remove&&confirm(`למחוק את ${b.dataset.remove}?`)){state.items=state.items.filter(x=>x.symbol!==b.dataset.remove);state.alerts=state.alerts.filter(x=>x.symbol!==b.dataset.remove);selected=null;save();render()}if(b.dataset.delalert){state.alerts.splice(Number(b.dataset.delalert),1);save();render()}};render();fetch('/api/portfolio',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('load failed');return r.json()}).then(d=>{KEY='financial-center-v2-'+d.userKey;if(d.fresh&&d.isInitialOwner){try{let prior=JSON.parse(localStorage.getItem('financial-center-v1'));state=prior&&Array.isArray(prior.items)?prior:d.portfolio}catch{state=d.portfolio}}else state=d.portfolio;remoteReady=true;$('#add').disabled=false;$('#import').disabled=false;if(d.fresh)save();else{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('sync').textContent='מסונכרן'}render()}).catch(()=>{document.getElementById('sync').textContent='הטעינה נכשלה · נסה לרענן את הדף'})
</script></body></html>
